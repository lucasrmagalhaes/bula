[project]
name = "bula-knowledge"
version = "0.1.0"
description = "Serviço de conhecimento do Bula: ingestão de documentação, busca híbrida em Postgres com pgvector e workflow de RAG em LangGraph."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "httpx>=0.27",
  "fastembed>=0.5",
  "langgraph>=1.0",
  "langchain>=1.0",
  "langchain-anthropic>=1.0",
  "mlflow>=3.4",
]

[project.optional-dependencies]
# Postgres com pgvector embutido, para desenvolver e testar sem Docker.
embedded = ["pgserver>=0.1.4"]
openai = ["langchain-openai>=1.0"]
google = ["langchain-google-genai>=3.0"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
bula-knowledge = "bula_knowledge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bula_knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: usa o Postgres embutido (pgserver)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"] # acentos e travessões em pt-BR não são ambiguidade

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src"]
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
